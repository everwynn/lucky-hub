# lucky-hub 唯一的 workflow：构建静态站 → 部署 GitHub Pages。
# 抓取已经搬到本地（npm run dev 的「立即抓取」按钮），这里只负责构建与发布。
name: deploy

# 两种触发：
#   push             → 本地提交后自动上线（数据、文案、样式都算）
#   workflow_dispatch → 网页手动重跑
# 原本的 cron 定时抓取已移除：福彩官网对 GitHub 海外 IP 返回 403，跑了只会多一条失败记录。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时刻只允许一条流水线在跑，后来的排队而不是取消前一条。
# cancel-in-progress: false —— 连推两次时让后一次等前一次跑完，避免部署产物互相覆盖。
concurrency:
  group: lucky-pipeline
  cancel-in-progress: false

# 最小权限，缺一不可：
#   contents: read   → checkout 要拉代码。一旦写了 permissions，未列出的权限会变成 none，
#                      所以这条不能省，省了 checkout 直接失败。
#   pages: write     → deploy-pages 发布产物
#   id-token: write  → deploy-pages 走 OIDC 认证，缺这条会直接报错
# 本 workflow 不再修改仓库内容，因此不需要 contents: write。
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 绑定 GitHub Pages 环境；部署成功后仓库首页会显示可点击的站点地址。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 1. 取代码。默认 fetch-depth: 1（浅克隆）足够，构建不依赖 git 历史。
      - uses: actions/checkout@v4

      # 2. Node 20 + npm 缓存。cache: npm 依赖仓库根目录的 package-lock.json。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 按 lock 文件精确安装（.npmrc 的 legacy-peer-deps=true 是必需的，别删）。
      - run: npm ci
      # 4. 测试门禁：任一失败即中止整条流水线，坏数据不会上线。
      #    两个命令是分开的：npm test 跑 .mjs 脚本测试，test:lib 用 tsx 跑 .ts 测试。
      - run: npm test
      - run: npm run test:lib

      # 5. 构建静态站（build 前会先跑 sync-data，把 data/ 复制到 public/data/）。
      #    CI=true 让 astro.config.mjs 把 base 切成 /lucky-hub/：
      #    仓库名必须也叫 lucky-hub，否则 CSS/JS 全部 404，页面变纯文字。
      #    （Actions 默认就注入 CI=true，这里显式写出是为了让意图可读，不是必需项。）
      - name: Build
        env:
          CI: 'true'
        run: npm run build

      # 6. 把 dist/ 打包成 Pages 部署产物（产物名固定为 github-pages）。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 7. 发布到 Pages。失败时线上仍是上一个版本，不会出现半截站点。
      - id: deployment
        uses: actions/deploy-pages@v4
